<!DOCTYPE html>
<html>
    <head>
        <title>Register</title>
        <link rel="stylesheet" href="task1.css">
    </head>
    <body>
         <!-- Registration Form -->
    <section id="register">
        <h2 class="section-title">Event Registration</h2>

        <form class="registration-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="roll">College Roll Number</label>
            <input type="text" id="roll" placeholder="Enter your roll number" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number"
                   pattern="[0-9]{10}" maxlength="10" required>

            <label for="category">Event Category</label>
            <select id="category" required>
                <option value="">Select a category</option>
                <option>Technical Events</option>
                <option>Cultural Events</option>
                <option>Workshops</option>
            </select>

            <label for="event">Choose an Event</label>
            <select id="event" required>
                <option value="">Select an event</option>
                <option>Paper Presentation</option>
                <option>Code Challenge</option>
                <option>Web Design Competition</option>
                <option>Dance Competition</option>
                <option>Singing Competition</option>
                <option>Fashion Show</option>
                <option>AI Workshop</option>
                <option>Robotics Workshop</option>
            </select>

            <button type="submit" class="btn">Submit Registration</button>
        </form>
    </section>

    </body>
</html>
